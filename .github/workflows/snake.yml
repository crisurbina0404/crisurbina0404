name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generar SVG (blaugrana)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: crisurbina0404
          outputs: |
            dist/github-snake.svg?color_snake=#EDBB00&color_dots=#ebedf0,#f0a8c4,#d6336c,#a50044,#6d0030
            dist/github-snake-dark.svg?color_snake=#EDBB00&color_dots=#0a0e27,#3d1030,#7a1a4a,#a50044,#d6336c


      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
